name: Verify OMPilot
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - run: bun run compile
      - run: bun run test
      - run: bun run build
      - run: bun run package
      - uses: actions/upload-artifact@v4
        with:
          name: ompilot-vsix
          path: '*.vsix'
